<!doctype html>
<html lang="de" data-motion="full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#efebe0" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0e0e0b" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TRAINR">
  <meta name="description" content="TRAINR – lokale Fußball-Trainingsplanung für Feldspieler- und Torwarttrainer. Offline, ohne Konto.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>TRAINR</title>
  <link rel="preload" href="styles/fonts/archivo.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles/tokens.css?v=21.30.2">
  <link rel="stylesheet" href="styles/app.css?v=21.30.2">
  <link rel="stylesheet" href="styles/print.css?v=21.30.2" media="print">
  <script>
    // Theme vor dem ersten Zeichnen setzen, damit es nicht flackert.
    try { const s = JSON.parse(localStorage.getItem('trainr-v21') || 'null')?.settings; const t = s?.theme || 'system';
      document.documentElement.dataset.theme = t === 'system' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : t;
      if (s?.fontScale) document.documentElement.style.setProperty('--font-scale', s.fontScale / 100); } catch {}
  </script>
  <script type="module" src="src/main.js?v=21.30.2"></script>
</head>
<body>
  <a class="sr-only" href="#main">Zum Inhalt springen</a>
  <div class="app">
    <header class="appbar" id="appbar">
      <a class="brand" href="#heute" aria-label="TRAINR – Heute"><span class="brand-mark" aria-hidden="true"></span><span class="brand-word">TRAINR</span></a>
      <span class="appbar-title" id="appbar-title" aria-hidden="true"></span>
      <div class="appbar-actions">
        <button class="team-chip" id="team-chip" type="button" hidden aria-label="Mannschaft wechseln"></button>
        <button class="icon-btn" id="btn-undo" type="button" aria-label="Rückgängig" title="Rückgängig (Strg+Z)" disabled></button>
        <button class="icon-btn" id="btn-help" type="button" aria-label="Hilfe zu dieser Ansicht" title="Hilfe"></button>
      </div>
    </header>
    <nav class="tabbar" aria-label="Hauptnavigation">
      <span class="tab-indicator" aria-hidden="true"></span>
      <button class="tab" type="button" data-tab="heute"></button>
      <button class="tab" type="button" data-tab="uebungen"></button>
      <button class="tab" type="button" data-tab="planen"></button>
      <button class="tab" type="button" data-tab="training"></button>
      <button class="tab" type="button" data-tab="mehr"></button>
    </nav>
    <main id="main" tabindex="-1">
      <noscript><p style="padding:24px">TRAINR benötigt JavaScript.</p></noscript>
    </main>
  </div>
  <div id="print-root" aria-hidden="true"></div>
</body>
</html>
